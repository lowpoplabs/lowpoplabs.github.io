<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--ink:#221c15;--line:#453a2b;--cobalt:#d14b28;--amber:#d9a441;--mute:#7d715c;--mono:"Share Tech Mono","Consolas",monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ink);overflow:hidden}
  .rule{height:3px;background:linear-gradient(90deg,var(--line) 0 62%,var(--cobalt) 62%)}
  .ft{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:20px 36px 24px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
  .ft .hl{color:var(--amber)}
  .ft a{color:var(--mute);text-decoration:none;border-bottom:1px dotted var(--line)}.ft a:hover{color:var(--cobalt)}
  @media (max-width:640px){.ft{padding:16px 18px 20px;font-size:9px}}
</style>
<div class="rule"></div>
<div class="ft">
<!-- CONFIG -->
  <span>© 2026 <span class="hl">LowPopLabs</span></span>

  <span class="hl">Built for the quiet servers.</span>
<!-- END CONFIG -->
</div>
